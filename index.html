var subjectLayer=L.layerGroup().addTo(map);

var viewMode='sold';
function toggleView(mode){
  viewMode=mode;
  document.getElementById('btnSold').className='toggle-btn'+(mode==='sold'?' active':'');
  document.getElementById('btnActive').className='toggle-btn'+(mode==='active'?' active':'');
  document.querySelector('.legend-panel h4').textContent=mode==='sold'?'Sold PSF':'Asking PSF';
  document.querySelector('.filter-panel h4').textContent=mode==='sold'?'Filter Comps':'Filter Listings';
  af();
}

function gc(p){if(p<700)return'#2ecc40';if(p<1200)return'#f1c40f';if(p<1800)return'#e67e22';return'#e74c3c'}
function addrLink(d){return d.url?'<a href="'+d.url+'" target="_blank" style="color:#0066cc;text-decoration:underline;font-weight:bold;font-size:14px;">'+d.addr+' &#8599;</a>':'<b style="font-size:14px;">'+d.addr+'</b>';}

function havDist(lat1,lon1,lat2,lon2){
  var R=3958.8,dLat=(lat2-lat1)*Math.PI/180,dLon=(lon2-lon1)*Math.PI/180;
  var a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)*Math.sin(dLon/2);
  return Math.round(R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a))*100)/100;
}

function rc(data){
  cl.clearLayers();
  data.forEach(function(d){
    var distTxt=subject?'<br>Distance: '+havDist(subject.lat,subject.lng,d.lat,d.lng)+' mi from subject':'';
    var dateLine=d.type==='active'?'<span style="color:#27ae60;font-weight:bold;">ACTIVE LISTING</span>':'Sold: '+d.sold;
    var priceLabel=d.type==='active'?'Asking':'Price';
    L.circleMarker([d.lat,d.lng],{radius:6,color:'#333',weight:.8,fillColor:gc(d.ppsf),fillOpacity:.85})
    .bindPopup(addrLink(d)+'<br>'+d.city+', '+d.zip+'<br>'+dateLine+'<br>'+priceLabel+': $'+d.price.toLocaleString()+' ($'+d.ppsf.toLocaleString()+' PSF)<br>'+d.beds+'bd/'+d.baths+'ba | '+d.sqft.toLocaleString()+' sqft'+distTxt).addTo(cl);
  });
  var ccEl=document.getElementById('cc');if(ccEl)ccEl.textContent=data.length+(viewMode==='active'?' active listings':' SFR sales');
}

function af(){
  var md=parseFloat(document.getElementById('df').value),ms=parseInt(document.getElementById('sf').value)||0,mp=parseInt(document.getElementById('pf').value)||0,mpp=parseInt(document.getElementById('ppf').value)||0,zv=document.getElementById('zf').value;
  var src=viewMode==='active'?activeData:allData;
  var filtered=src.filter(function(d){
    var ok=d.sqft>=ms&&d.price>=mp&&d.ppsf>=mpp&&(zv==='all'||d.zip===zv);
    if(ok&&md<99&&subject) ok=havDist(subject.lat,subject.lng,d.lat,d.lng)<=md;
    return ok;
  });
  rc(filtered);
}

function setSubject(d){
  clearSubject();
  subject=d;
  // Star
  var color=gc(d.ppsf);
  var si=L.divIcon({html:'<div style="font-size:48px;color:'+color+';text-shadow:0 0 8px rgba(0,0,0,.8),-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000;line-height:48px;text-align:center;">&#9733;</div>',iconSize:[48,48],iconAnchor:[24,24],className:''});
  var statusLine=d.type==='active'?'<b style="color:#27ae60;">ACTIVE LISTING</b><br>Asking: $'+d.price.toLocaleString()+' ($'+d.ppsf.toLocaleString()+' PSF)':d.sold?'Sold: '+d.sold+'<br>Price: $'+d.price.toLocaleString()+' ($'+d.ppsf.toLocaleString()+' PSF)':'';
  var subjectMarker=L.marker([d.lat,d.lng],{icon:si,zIndexOffset:1000}).bindPopup(
    addrLink(d)+'<br>'+d.city+', '+d.zip+'<br><b style="color:#c0392b;">SUBJECT PROPERTY</b><br><br>'+statusLine+'<br>'+d.beds+'bd/'+d.baths+'ba | '+d.sqft.toLocaleString()+' sqft'+
    '<br><br><a href="#" onclick="clearSubject();return false;" style="color:#e74c3c;">Clear subject</a>'
  ).addTo(subjectLayer);
  // Circles
  [1,3,5].forEach(function(mi){
    L.circle([d.lat,d.lng],{radius:mi*1609.34,color:'#ffffff',weight:3,dashArray:'12,8',fill:false,opacity:.9}).addTo(subjectLayer);
    L.circle([d.lat,d.lng],{radius:mi*1609.34,color:'#1a5276',weight:1.5,fill:false,opacity:.9}).addTo(subjectLayer);
    var lblLat=d.lat+mi*(1/69.0);
    L.marker([lblLat,d.lng],{icon:L.divIcon({html:'<div style="font-size:12px;font-weight:bold;color:#1a5276;text-shadow:-1px -1px 0 #fff,1px -1px 0 #fff,-1px 1px 0 #fff,1px 1px 0 #fff,0 0 6px #fff;white-space:nowrap;">'+mi+' mi</div>',iconSize:[40,16],iconAnchor:[20,16],className:''}),interactive:false}).addTo(subjectLayer);
  });
  // Info panel
  var ip=document.getElementById('infoPanel');ip.style.display='block';
  document.getElementById('ipAddr').textContent=d.addr;
  document.getElementById('ipSub').textContent=d.city+', '+d.zip+(d.type==='active'?' \u2014 Active Listing':d.type==='sold'?' \u2014 Sold':' \u2014 Subject Property');
  var rows='';
  if(d.price)rows+='<div class="row"><span class="lbl">'+(d.type==='active'?'Asking':'Sold')+'</span><span class="val">$'+d.price.toLocaleString()+'</span></div>';
  if(d.ppsf)rows+='<div class="row"><span class="lbl">PSF</span><span class="val">$'+d.ppsf.toLocaleString()+'</span></div>';
  if(d.sqft)rows+='<div class="row"><span class="lbl">Size</span><span class="val">'+d.sqft.toLocaleString()+' sqft</span></div>';
  if(d.beds)rows+='<div class="row"><span class="lbl">Config</span><span class="val">'+d.beds+'bd / '+d.baths+'ba</span></div>';
  if(d.sold)rows+='<div class="row"><span class="lbl">Sold</span><span class="val">'+d.sold+'</span></div>';
  rows+='<div class="row"><span class="lbl">Comps</span><span class="val" id="cc">'+allData.length+' SFR sales</span></div>';
  document.getElementById('ipRows').innerHTML=rows;
  // Legend star
  document.getElementById('legendStar').style.display='flex';
  document.getElementById('legendStarIcon').style.color=color;
  document.getElementById('legendStarLabel').textContent='Subject ($'+d.ppsf.toLocaleString()+' PSF)';
  // Zoom and refresh comps
  map.setView([d.lat,d.lng],13);
  af();
}

function clearSubject(){
  subjectLayer.clearLayers();
  subject=null;
  document.getElementById('infoPanel').style.display='none';
  document.getElementById('legendStar').style.display='none';
  document.getElementById('df').value='99';
  af();
}

function doSearch(){
  var q=searchInput.value.trim().toLowerCase();
  if(q.length<2){searchResults.style.display='none';return [];}
  var terms=q.split(/[\s,]+/).filter(function(t){return t.length>0;});
  var matches=searchAll.filter(function(d){
    var full=(d.addr+' '+d.city+' '+d.zip).toLowerCase();
    return terms.every(function(t){return full.indexOf(t)!==-1;});
  }).slice(0,15);
  if(matches.length===0){
    searchResults.innerHTML='<div class="sr" style="cursor:pointer" onclick="geocodeSubject(document.getElementById(\'searchInput\').value)"><span class="addr">&#128205; Search map for: <i>'+searchInput.value+'</i></span><span class="meta">Not in dataset<br>Click to locate</span></div>';
    searchResults.style.display='block';return [];
  }
  searchResults.innerHTML='';
  matches.forEach(function(d){
    var row=document.createElement('div');row.className='sr';
    var tag=d.type==='active'?'<span style="background:#27ae60;color:#fff;padding:1px 5px;border-radius:3px;font-size:10px;margin-left:6px;">ACTIVE</span>':'<span style="background:#7f8c8d;color:#fff;padding:1px 5px;border-radius:3px;font-size:10px;margin-left:6px;">SOLD</span>';
    var priceLabel=d.type==='active'?'Asking':'Sold';
    row.innerHTML='<span class="addr">'+d.addr+tag+'</span><span class="meta">'+d.city+', '+d.zip+'<br>'+priceLabel+': $'+d.price.toLocaleString()+' &bull; $'+d.ppsf.toLocaleString()+' PSF</span>';
    row.onclick=function(){setSubject(d);searchInput.value='';searchResults.style.display='none';};
    searchResults.appendChild(row);
  });
  searchResults.style.display='block';
  return matches;
}

searchInput.addEventListener('input',doSearch);
searchInput.addEventListener('keydown',function(e){
  if(e.key==='Escape'){searchResults.style.display='none';this.blur();}
  if(e.key==='Enter'){var m=doSearch();if(m.length>0){setSubject(m[0]);searchInput.value='';searchResults.style.display='none';}else{geocodeSubject(searchInput.value);}}
});
document.addEventListener('click',function(e){if(!e.target.closest('.search-panel'))searchResults.style.display='none';});

function geocodeSubject(query){
  if(!query||query.trim().length<3)return;
  searchResults.innerHTML='<div style="padding:10px 14px;color:#888;">Searching...</div>';
  searchResults.style.display='block';
  fetch('https://nominatim.openstreetmap.org/search?format=json&q='+encodeURIComponent(query)+'&countrycodes=us&limit=1')
  .then(function(r){return r.json()})
  .then(function(data){
    if(!data||data.length===0){searchResults.innerHTML='<div style="padding:10px 14px;color:#e74c3c;">Address not found.</div>';return;}
    var loc=data[0];var lat=parseFloat(loc.lat),lng=parseFloat(loc.lon);
    var shortName=query.split(',')[0].trim();
    var d={lat:lat,lng:lng,addr:shortName,city:'',zip:'',price:0,ppsf:0,sqft:0,beds:0,baths:0,sold:'',dist:0,type:'custom',url:''};
    setSubject(d);
    searchInput.value='';searchResults.style.display='none';
  }).catch(function(e){searchResults.innerHTML='<div style="padding:10px 14px;color:#e74c3c;">Geocoding error.</div>';});
}
</script></body></html>
